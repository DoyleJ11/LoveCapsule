name: Preview Build

on:
  workflow_dispatch:

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: '26.0.0'
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate app
        run: npm run validate

      - name: Build preview
        run: eas build --platform ios --profile preview --non-interactive
