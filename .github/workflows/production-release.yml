name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and submit'
        required: true
        type: string

concurrency:
  group: ios-production-release
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build & Submit to TestFlight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify release tag and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: GITHUB_REF_NAME="$RELEASE_TAG" node scripts/check-release.cjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: '26.0.0'
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run validate

      - name: Build and submit this exact build to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive
